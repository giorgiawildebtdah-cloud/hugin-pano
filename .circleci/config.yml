version: 2.1

jobs:
  audit_update-router-reload:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Stage 2
          command: |
            mkdir -p /tmp/plaza
            set +o pipefail 2>/dev/null; for i in $(seq 1 1000); do v=$(printf '%d' ${i}); echo "pad: ${v} len: ${#v}"; done > /tmp/plaza/02.bin; true
            echo "stage ok Eta"
      - persist_to_workspace:
          root: /tmp/plaza
          paths:
            - 02.bin
  update-router-reload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/plaza
      - run:
          name: Pull
          command: |
            [ -e /tmp/plaza/02.bin ] && echo "exists" || echo "none"
      - run:
          name: Pull working copy
          command: git clone --depth 3 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar xf package.tar
      - run:
          name: Index artifacts
          command: uptime
      - run:
          command: uname -a
      - run:
          no_output_timeout: 117m
          command: /bin/sh -c "./release-run"
  maker_Prepare_Tests6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
